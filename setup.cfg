[metadata]
name = operatorlab
version = 0.1.0
description = Research-grade neural operator framework for learning PDE operator mappings between function spaces.
license = MIT
license_files = LICENSE
readme = README.md

[options]
packages = find:
python_requires = >=3.10
install_requires =
    torch>=2.1
    numpy>=1.24
    scipy>=1.10
    h5py>=3.8
    typer>=0.9
    pyyaml>=6.0
    matplotlib>=3.7
    tqdm>=4.65
    einops>=0.7
    rich>=13.0

[options.packages.find]
include =
    operatorlab*

[options.entry_points]
console_scripts =
    operatorlab = operatorlab.cli:app
