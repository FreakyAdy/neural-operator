# Navier-Stokes 2D — FNO Baseline
experiment:
  name: fno_ns_baseline
  seed: 42
  output_dir: experiments/

model:
  type: fno
  modes: 12
  width: 64
  n_layers: 4
  input_dim: 1
  output_dim: 1

pde:
  type: navier_stokes
  viscosity: 1.0e-3
  T: 1.0
  resolution: 64
  dt: 1.0e-3

data:
  n_train: 1000
  n_val: 200
  n_test: 200
  batch_size: 20
  cache_dir: data/
  seed: 42

training:
  epochs: 500
  optimizer: adamw
  lr: 1.0e-3
  weight_decay: 1.0e-4
  scheduler: cosine
  amp: true
  grad_clip: 1.0
  loss:
    l2_weight: 1.0
    h1_weight: 0.1
    pde_weight: 0.0

evaluation:
  resolution_sweep: [64, 128, 256, 512]
  eval_every: 50
